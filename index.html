.qt-solo-head h1 { margin: 0px; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.qt-solo-head p { margin: 2px 0px 0px; font-size: 13px; color: var(--muted); }
@media (max-width: 700px){.qt-solo { padding: 14px 14px 48px; }.qt-solo-head h1 { font-size: 19px; }}
@keyframes sl-shine { 
  0% { background-position: -200% 0px; }
  100% { background-position: 200% 0px; }
}
@keyframes sl-overlay-in { 
  0% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes sl-dialog-in { 
  0% { opacity: 0; transform: translateY(8px) scale(0.97); }
  100% { opacity: 1; transform: none; }
}
@keyframes sl-sheet-in { 
  0% { transform: translateY(100%); }
  100% { transform: none; }
}
@keyframes qt-flash { 
  0% { box-shadow: 0 0 0 4px var(--teal-soft); }
  100% { box-shadow: transparent 0px 0px 0px 4px; }
}/* 83. Admin · cotizaciones de servicio: formulario a la izquierda, resumen con total y recientes a la derecha */
.qt { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.qt-main { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.qt-side { display: flex; flex-direction: column; gap: 20px; position: sticky; top: 16px; min-width: 0; }
.qt-lb { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.qt-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.qt-presets .qt-lb { min-width: 74px; }
.qt-head, .qt-row { display: grid; grid-template-columns: 124px minmax(0, 1.5fr) minmax(0, 1fr) 118px 34px; gap: 8px; align-items: center; }
.qt-head[hidden] { display: none; }
.qt-head { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 2px; }
.qt-items { display: flex; flex-direction: column; gap: 8px; }
.qt-row input, .qt-row select { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--radius-sm); background: var(--surface); font: inherit; font-size: 14px; color: var(--ink); min-width: 0; }
.qt-row input:focus, .qt-row select:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
.qt-row input[data-qi="importe"] { text-align: right; font-variant-numeric: tabular-nums; }
.qt-x { width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; font-size: 20px; line-height: 1; color: var(--muted); }
.qt-x:hover { background: var(--bg-2); color: var(--red); }
.qt-sum { gap: 12px; }
.qt-sum .qt-lb strong { margin-left: 6px; color: var(--ink); font-size: 14px; letter-spacing: 0; }
.qt-total { border-radius: var(--radius-sm); background: var(--navy-fill, var(--ink)); color: #fff; padding: 14px 16px; }
.qt-total small { display: block; font-size: 12px; font-weight: 700; opacity: .85; }
.qt-total strong { display: block; margin-top: 2px; font-size: 26px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.qt-total em { display: block; margin-top: 4px; min-height: 16px; font-style: normal; font-size: 12px; opacity: .85; }
.qt-hist { display: flex; flex-direction: column; }
.qt-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
.qt-h:first-child { border-top: 0; padding-top: 0; }
.qt-h .sub { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qt-h-t { font-weight: 800; font-variant-numeric: tabular-nums; align-self: start; }
.qt-h-a { grid-column: 1 / -1; display: flex; gap: 14px; }
@media (max-width: 1180px) { .qt { grid-template-columns: minmax(0, 1fr); } .qt-side { position: static; } }
@media (max-width: 720px) { .qt-head { display: none; } .qt-row { grid-template-columns: 1fr 1fr; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); } .qt-row select, .qt-row input[data-qi="concepto"] { grid-column: 1 / -1; } .qt-row input[data-qi="detalle"] { grid-column: 1 / -1; } .qt-x { justify-self: end; } }
.qt-prev { display: block; width: 100%; max-height: 62vh; object-fit: contain; border: 1px solid var(--line); border-radius: var(--radius-sm); background: #fff; }
.qt-parse-msg:empty { display: none; }
.qt-parse-msg { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.qt-parse-msg p { margin: 0; }
.qt-parse-msg .qt-dudas { margin-top: 6px; color: #8a5a00; }

/* Cotizaciones: lo que el lector no entendió se resuelve con un toque, y lo que falta se marca en su campo */
.qt-miss:empty { display: none; }
.qt-miss { margin-top: 6px; color: #8a5a00; }
.qt-link { padding: 0; border: 0; background: none; font: inherit; font-weight: 700; color: var(--teal-dark); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.qt-parse-msg .qt-dudas-t { margin-top: 10px; font-weight: 700; color: #8a5a00; }
.qt-dl { list-style: none; margin: 4px 0 0; padding: 0; }
.qt-dl li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.qt-dtxt { flex: 1 1 240px; min-width: 0; color: var(--ink); overflow-wrap: anywhere; }
.qt-dopts { display: flex; flex-wrap: wrap; gap: 6px; }
.qt-dopts .chip.is-suggest { background: var(--teal-soft); border-color: var(--teal); color: var(--teal-dark); }
.field.is-missing input, .field.is-missing textarea, .qt-row input.is-missing { border-color: var(--amber); }
.field.is-missing label > span::after { content: " (falta)"; font-weight: 700; color: #8a5a00; }
.field.is-flash :is(input, textarea), .qt-row.is-flash { animation: qt-flash 1.4s var(--ease); border-radius: var(--radius-sm); }
@keyframes qt-flash { 0% { box-shadow: 0 0 0 4px var(--teal-soft); } 100% { box-shadow: 0 0 0 4px transparent; } }
@media (prefers-reduced-motion: reduce) { .field.is-flash :is(input, textarea), .qt-row.is-flash { animation: none; } }

/* Cotizacion de renta: reglas de escritura plegables */
.qt-rules { margin: -4px 0 12px; font-size: 13px; }
.qt-rules summary { cursor: pointer; font-weight: 700; color: var(--teal-dark); }
.qt-rules ul { margin: 8px 0 0; padding-left: 18px; line-height: 1.55; }
.qt-rules em { font-style: normal; font-weight: 700; color: var(--ink); }
/* Cotizacion de renta: selector de IVA (importes sin IVA o con IVA incluido) */
.qt-iva { margin: 0 0 14px; }
.field.has-error input, .field.has-error select, .field.has-error textarea { border-color: var(--red); }
.field-error { font-size: 12px; font-weight: 600; color: var(--red); }

        <p class="panel-sub">${canShare ? 'Con “Compartir o guardar” eliges WhatsApp, Fotos o Archivos desde el menú del teléfono.' : 'En el celular, mantén presionada la imagen para guardarla en la galería.'}</p>
        <div class="modal-actions"><button class="btn btn-ghost" data-action="dismiss">Cerrar</button><button class="btn btn-outline" data-action="qt-img-dl">Descargar JPG</button>${canShare ? '<button class="btn btn-primary" data-action="qt-img-share">Compartir o guardar</button>' : ''}</div></div>`);
      toast('Imagen lista');
      qtSet(qtBlank(q.tipo)); renderAdminMount(); window.scrollTo(0, 0);   // la imagen ya se generó (y quedó en Recientes): el formulario se limpia solo, igual que con Limpiar
    } catch (e) { toast('No se pudo crear la imagen: ' + e.message, 'error'); }
    finally { el.disabled = false; }
  },
  async 'qt-img-share'() {
    if (!qtImg) return;
    try { await navigator.share({ files: [qtImg.file], title: qtImg.name.replace(/\.jpg$/, '') }); }
    catch (e) { if (e.name !== 'AbortError') toast('No se pudo abrir el menú de compartir: usa “Descargar JPG”', 'error'); }   // cerrar el menú sin elegir no es un error
  },
  'qt-img-dl'() {
    if (!qtImg) return;
    const a = document.createElement('a'); a.href = qtImg.url; a.download = qtImg.name; document.body.appendChild(a); a.click(); a.remove(); toast('Imagen descargada');
  },
  async 'qt-parse'(el) {
    const ta = $('#q-paste'), msg = $('#qt-parse-msg'), txt = ta ? ta.value.trim() : ''; if (!txt) return toast('Pega primero el texto de la cotización', 'error');
    const r = qtParse(txt), q = qtCur();
    ['cliente', 'telefono', 'vehiculo', 'modelo', 'placas', 'km', 'servicio', ...(qtRent(q) ? ['empresa', 'rfc', 'unidades', 'plazo', 'inicio', 'vig'] : [])].forEach(k => { if (r[k]) q[k] = r[k]; });
    const warns = []; if (qtRent(q)) ['cliente', 'empresa', 'rfc', 'telefono', 'vehiculo', 'modelo', 'unidades', 'plazo', 'vig'].forEach(k => { if (!String(q[k] || '').trim()) return; const f = qtFix(k, q[k]); q[k] = f.v; if (f.err) warns.push(f.err); });   // las mismas reglas de escritura que al teclear
    if (r.items.length) q.items = r.items;   // los conceptos se reemplazan por los del texto
    qtSaveDraft(q);
    $$('[data-q]').forEach(el => { if (q[el.dataset.q] != null && el.tagName !== 'TEXTAREA') el.value = q[el.dataset.q]; });
    qtPaintItems();
    const parts = [`${r.items.length} ${r.items.length === 1 ? 'concepto' : 'conceptos'} · ${qtMoney(qtTotal(q))}`];
    if (r.cliente) parts.push((qtRent(q) ? 'contacto ' : 'cliente ') + r.cliente); if (r.empresa) parts.push('empresa ' + r.empresa); if (r.vehiculo || r.modelo) parts.push('auto ' + [r.vehiculo, r.modelo].filter(Boolean).join(' ')); if (r.servicio) parts.push('servicio “' + r.servicio + '”');
    qtDudas = r.dudas.map(t => ({ t })); qtHelpOn = true;
    if (msg) msg.innerHTML = `<p><strong>${r.items.length ? 'Listo, revisa los datos:' : 'No encontré conceptos con importe.'}</strong> ${esc(parts.join(' · '))}</p>${warns.length ? `<p class="qt-dudas-t">Revisa: ${esc(warns.join(' '))}</p>` : ''}<p id="qt-miss" class="qt-miss"></p><div id="qt-dudas"></div>`;
    qtPaintMiss(); qtPaintDudas();
    // Con todo entendido y los datos clave completos, la imagen sale lista; si falta algo se queda el formulario para corregirlo y la imagen se pide con su botón
    const pend = qtDudas.length || warns.length || qtReq().some(([k]) => !String(q[k] || '').trim());
    if (r.items.length && qtTotal(q) > 0 && !pend) return actions['qt-img'](el);
    toast(r.items.length ? (pend ? 'Formulario llenado: completa lo marcado y presiona “Imagen JPG”' : 'Formulario llenado: revisa los datos') : 'No se encontraron conceptos con importe', r.items.length ? '' : 'error');
  },
  'qt-paste-clear'() {   // sin texto pegado no hay conceptos: Limpiar vacía también la lista
    const ta = $('#q-paste'), msg = $('#qt-parse-msg'); if (ta) { ta.value = ''; ta.focus(); } if (msg) msg.innerHTML = ''; qtDudas = []; qtHelpOn = false;
    const q = qtCur(); q.items = []; qtSaveDraft(q); qtPaintItems(); qtPaintMiss();
  },
  'qt-focus'(el) { const f = $('#q-' + el.dataset.k); if (f) { f.scrollIntoView({ block: 'center' }); f.focus(); } },
  'qt-duda'(el) {
    const i = +el.dataset.i, d = qtDudas[i]; if (!d) return;
    const q = qtCur(), as = el.dataset.as; let hit = null;
    if (as === 'cliente') { q.cliente = qtTitleCase(d.t.replace(/^(cliente|nombre)\s*[:=]?\s*/i, '')); hit = '#q-cliente'; }
    else if (as === 'auto') { const y = d.t.match(/\b(19[89]\d|20[0-3]\d)\b/), car = qtCar(qtNorm(d.t)); q.vehiculo = car || d.t.replace(y ? y[0] : '', '').replace(/\s+/g, ' ').trim(); if (y) q.modelo = y[1]; hit = '#q-vehiculo'; }
    else if (as === 'nota') { q.notas = q.notas ? q.notas + '\n' + d.t : d.t; hit = '#q-notas'; }
    else if (as === 'concepto') { const a = qtAmtIn(d.t), it = qtItem(a ? d.t.replace(a.raw, ' ') : d.t, a && isFinite(a.val) ? a.val : ''); if (!it) return toast('No pude armar el concepto: agrégalo a mano', 'error'); q.items.push(it); hit = 'row'; }
    qtDudas.splice(i, 1); qtSaveDraft(q);
    $$('[data-q]').forEach(x => { if (q[x.dataset.q] != null) x.value = q[x.dataset.q]; });
    qtPaintItems(); qtPaintMiss(); qtPaintDudas();
    const target = hit === 'row' ? [...$$('#qt-items .qt-row')].pop() : hit && $(hit) && $(hit).closest('.field');
    if (target) { target.scrollIntoView({ block: 'nearest' }); target.classList.remove('is-flash'); void target.offsetWidth; target.classList.add('is-flash'); }
    if (hit === 'row' && target) { const imp = target.querySelector('[data-qi="importe"]'); if (imp && !imp.value.trim()) imp.focus(); }
  },
};
/* Cotizaciones: lo que se escribe queda como borrador en este navegador y el total se actualiza al momento */
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && (el.dataset.q || el.dataset.qi); if (!k) return;
  const q = qtCur();
  if (el.dataset.q) q[k] = el.value;
  else { const it = q.items[+el.closest('.qt-row').dataset.i]; if (!it) return; it[k] = el.value; }
  qtSaveDraft(q);
  if (el.dataset.qi) { qtPaintTotal(); const row = el.closest('.qt-row'), imp = row.querySelector('[data-qi="importe"]'), it = q.items[+row.dataset.i]; imp.classList.toggle('is-missing', !!String(it.concepto || '').trim() && !qtNum(it.importe)); }
  else if (qtHelpOn) qtPaintMiss();
});
document.addEventListener('change', e => {   // al elegir una unidad de renta del inventario se completa el año si está vacío
  const el = e.target; if (!el.dataset || el.dataset.q !== 'vehiculo' || !qtRent()) return;
  const v = db.vehicles.filter(isRent).find(x => (x.brand + ' ' + x.model).toLowerCase() === el.value.trim().toLowerCase()), m = $('#q-modelo');
  if (v && m && !m.value.trim()) { m.value = String(v.year); qtCur().modelo = m.value; qtSaveDraft(qtCur()); }
});
document.addEventListener('change', e => {   // al elegir un cliente guardado se completa su teléfono si está vacío
  const el = e.target; if (!el.dataset || el.dataset.q !== 'cliente') return;
  const c = db.clients.find(x => x.name === el.value), t = $('#q-telefono');
  if (c && c.phone && t && !t.value.trim()) { const ph = qtRent() ? qtPhone(c.phone) : c.phone; t.value = ph; qtCur().telefono = ph; qtSaveDraft(qtCur()); }
});
/* Si se borra todo el texto pegado, los conceptos también se vacían (sin texto no hay conceptos) */
document.addEventListener('input', e => {
  const el = e.target; if (!el.id || el.id !== 'q-paste') return;
  const has = !!el.value.trim(), had = el.dataset.had === '1'; el.dataset.had = has ? '1' : '';
  if (has || !had) return;
  const q = qtCur(); q.items = []; qtSaveDraft(q); qtPaintItems(); qtDudas = []; qtHelpOn = false; const msg = $('#qt-parse-msg'); if (msg) msg.innerHTML = ''; qtPaintMiss();
});
/* Cotización de renta · reglas de escritura: al salir de un campo se acomoda (nombre en tipo título, RFC en mayúsculas, teléfono con espacios, empresa, año, unidades y plazo en su rango) y, si no es válido, se avisa debajo del campo */
const QT_FIX_KEYS = ['cliente', 'empresa', 'rfc', 'telefono', 'vehiculo', 'modelo', 'unidades', 'plazo', 'vig'];
function qtFieldError(fld, msg) {
  if (!fld) return; fld.classList.remove('has-error'); fld.querySelectorAll('.field-error').forEach(m => m.remove());
  if (msg) { fld.classList.add('has-error'); fld.insertAdjacentHTML('beforeend', `<span class="field-error">${esc(msg)}</span>`); }
}
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset && el.dataset.q; if (!k || !qtRent()) return;
  const q = qtCur();
  if (QT_FIX_KEYS.includes(k)) { const f = qtFix(k, el.value); el.value = f.v; q[k] = f.v; qtFieldError(el.closest('.field'), f.err); }
  if (k === 'inicio' || k === 'fecha') { const i = $('#q-inicio'); qtFieldError(i && i.closest('.field'), q.inicio && q.fecha && q.inicio < q.fecha ? 'El inicio es anterior a la fecha de la cotización.' : ''); }
  qtSaveDraft(q); if (qtHelpOn) qtPaintMiss();
});
document.addEventListener('input', e => { const fld = e.target.closest && e.target.closest('.field.has-error'); if (fld) { fld.classList.remove('has-error'); fld.querySelectorAll('.field-error').forEach(m => m.remove()); } });
document.addEventListener('click', e => {
  if (e.target.closest('#modal-root a[href]')) closeModal();
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = actions[el.dataset.action]; if (!fn) return;
  if (el.dataset.action !== 'backdrop') e.preventDefault();
  fn(el, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root .modal')) { e.preventDefault(); actions.dismiss(); } });
renderAdminMount();
})();
</script></body></html>
